# Construye un APK de prueba (debug) en cada cambio a main y lo deja descargable en la pestaña Actions → la ejecución → Artifacts.
name: APK
on:
  push:
    branches: [main]
    paths: ['android/**', '*.js', 'index.html', 'styles.css', 'assets/**', 'capacitor.config.json', 'package.json']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rodapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
