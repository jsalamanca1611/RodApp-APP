# Construye un APK de prueba (debug) en cada cambio a main y lo deja descargable en la pestaña Actions → la ejecución → Artifacts.
name: APK
on:
  push:
    branches: [main]
    paths: ['android/**', '*.js', 'index.html', 'styles.css', 'assets/**', 'capacitor.config.json', 'package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rodapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en Releases (siempre la última versión)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RodApp.apk
          gh release delete apk-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest RodApp.apk --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "RodApp · APK de prueba" --notes "Versión de prueba generada automáticamente del commit ${GITHUB_SHA::7}. Descarga RodApp.apk e instálalo en Android (permite instalar apps desconocidas)."
